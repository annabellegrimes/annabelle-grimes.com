<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annabelle Grimes</title>
  <style>
    :root { --bg: #fdfcfa; --fg: #1f1f1f; --muted: #666; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #eee; --muted: #aaa; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: var(--bg); color: var(--fg);
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
    main { max-width: 36rem; text-align: center; }
    h1 { font-weight: 600; font-size: 2.25rem; margin: 0 0 .5rem; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Annabelle Grimes</h1>
    <p>Site coming soon.</p>
  </main>
</body>
</html>
